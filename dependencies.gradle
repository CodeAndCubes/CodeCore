dependencies {
    compileOnly 'com.mrleonardos:codesides:1.0.0'

    shadowImplementation 'com.twelvemonkeys.imageio:imageio-webp:3.9.4'
    shadowImplementation 'com.electronwill.night-config:core:3.6.7'
    shadowImplementation 'com.electronwill.night-config:toml:3.6.7'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}
